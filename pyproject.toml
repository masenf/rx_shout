[project]
name = "rx-shout"
version = "0.1.0"
description = "A shoutbox-like app for posting of images and text."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "boto3>=1.43.4",
    "greenlet>=3.5.0",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "reflex-google-auth>=0.0.4",
    "reflex[db]~=0.9.6.post1",
    "reflex-enterprise>=0.9.1",
    "pytest-playwright>=0.8.0",
]

[dependency-groups]
dev = [
    "codespell>=2.4.2",
    "moto[server]>=5.2.2",
    "oidc-provider-mock>=0.4.6",
    "pre-commit>=4.6.0",
    "pyright>=1.1.410",
    "pytest-cov>=7.0",
    "ruff>=0.15.19",
]

[tool.uv.sources]
reflex-enterprise = { path = "/Users/masenf/code/reflex-dev/reflex-enterprise" }

[tool.pytest.ini_options]
addopts = ["--cov", "--cov-report=term-missing"]
# Make `rx_shout` importable from the unit tests without installing the project.
pythonpath = ["."]
reflex_run_mode = "dev,prod"

[tool.coverage.run]
# Measure the app code explicitly since it may not be directly imported in the
# main pytest process.
source = ["rx_shout"]
branch = true
# a subprocess will write a separate .coverage.* file to be combined by pytest-cov.
parallel = true
patch = [
  "subprocess",  # inject coverage into `reflex run` and workers
  "_exit",       # flush coverage data on os._exit()
]
# The test harness stops the app with SIGTERM.
sigterm = true
# Ignore warning if the test cases never imports `rx_shout` directly.
disable_warnings = ["no-data-collected"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
# The prod-mode side of dev/prod guards cannot be reached by the dev-mode test
# app; setting partial_branches replaces the default, so keep the pragma too.
partial_branches = ["pragma: no branch", "if not is_prod_mode\\(\\):"]
skip_empty = true

[tool.ruff]
target-version = "py314"
output-format = "concise"
lint.isort.split-on-trailing-comma = false
lint.select = [
    "ANN001",
    "B",
    "C4",
    "D",
    "E",
    "ERA",
    "F",
    "FURB",
    "I",
    "N",
    "PERF",
    "PGH",
    "PTH",
    "RUF",
    "SIM",
    "T",
    "TRY",
    "W",
]
lint.ignore = [
    "B008",
    "D205",
    "E501",
    "F403",
    "SIM115",
    "RUF006",
    "RUF008",
    "RUF012",
    "TRY0",
]
lint.pydocstyle.convention = "google"
lint.allowed-confusables = ['’']

[tool.ruff.lint.per-file-ignores]
"**/alembic/*.py" = ["D", "ERA"]
"__init__.py" = ["ERA"]
"rxconfig.py" = ["D"]

[tool.pyright]
reportIncompatibleMethodOverride = false
reportMissingImports = false
reportInconsistentOverload = false
reportIncompatibleVariableOverride = "warning"
exclude = [
    "**/alembic/*",
    ".web/*",
]

[tool.codespell]
skip = "*.lock,*.db,./.web,./assets"
